name: scoresphere

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scoresphere
      POSTGRES_PASSWORD: scoresphere
      POSTGRES_DB: scoresphere
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scoresphere -d scoresphere']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
