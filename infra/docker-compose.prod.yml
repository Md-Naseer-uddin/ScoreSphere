# Production-shaped stack: Postgres, a one-off migration, the API and the web app.
# Copy infra/.env.example to infra/.env and fill it in; never commit the real file.
# Put a TLS-terminating load balancer in front of `web` (port 8080).
name: scoresphere
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: scoresphere
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d scoresphere']
      interval: 5s
      retries: 20

  migrate:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: scoresphere-api
    env_file: .env
    command: ['node', 'dist/migrate.js']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: scoresphere-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3300'
      TRUST_PROXY: '2'
      STORAGE_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.scoresphere.example}
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on: [api]

volumes:
  pgdata:
  media:
